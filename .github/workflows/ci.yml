name: LMS-Assess CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Hardening & Test Verification
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: lms-backend/package-lock.json

      - name: Setup Python 3 (Sandbox Runtime)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        working-directory: ./lms-backend
        run: npm ci

      - name: Execute Unified Test Suite
        working-directory: ./lms-backend
        env:
          PORT: 5000
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/lms_assess_test
          JWT_SECRET: ci_test_secret_key_1234567890
          CLIENT_URL: http://localhost:5173
        run: npm test

  frontend-build:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: lms-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./lms-frontend
        run: npm ci

      - name: Lint Frontend Code
        working-directory: ./lms-frontend
        run: npm run lint

      - name: Build Production Bundle
        working-directory: ./lms-frontend
        run: npm run build
